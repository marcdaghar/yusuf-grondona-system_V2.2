# ============================================================
# Docker Compose – VPS Deployment
# Yusuf-Grondona System
# ============================================================
#
# Version optimisée pour VPS (ressources limitées).
#
# Usage:
#   docker-compose -f deploy/docker-compose.vps.yml up -d
#
# License: CC BY-SA 4.0 – Marc Daghar
# ============================================================

version: '3.8'

services:
  # ---- API (light) ----
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: api-light
    container_name: yusuf-api-light
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/yusuf_grondona.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yusuf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Dashboard ----
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: dashboard
    container_name: yusuf-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      - api
    networks:
      - yusuf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- MQTT Broker (IoT) ----
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: yusuf-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - yusuf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Nginx ----
  nginx:
    image: nginx:alpine
    container_name: yusuf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - dashboard
    networks:
      - yusuf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ---- Networks ----
networks:
  yusuf-network:
    driver: bridge
    name: yusuf-network
